  const FLASK_HEAL_AMOUNT = 35;

  function drinkFlask() {
    if (p.dead) return;
    if (p.drinking) return;
    if (p.attacking || p.defending || p.dashing || p.parrying) return;
    if (p.stunTimer > 0) return;
    if (inventoryOpen || itemPickerOpen || pickupWindowOpen) return;

    // Solo si el slot de botellas equipado tiene un Frasco Vital
    const equippedBottle = INVENTORY.bottle.slots[equipped.bottle];
    if (!equippedBottle) return;
    if (equippedBottle.name !== 'Frasco Vital') return;
    if (equippedBottle.qty <= 0) return;

    p.drinking = true;
    player.classList.add('drinking');

    // Curar a mitad de la animación
    setTimeout(() => {
      if (p.dead) return;
      p.hp = Math.min(PLAYER_MAX_HP, p.hp + FLASK_HEAL_AMOUNT);
      spawnDamageNumber(player, '+' + FLASK_HEAL_AMOUNT, { heal: true });
      updateHUD();
    }, 400);

    // Terminar la animación y consumir 1 frasco
        // Terminar la animación y consumir 1 frasco
    setTimeout(() => {
      p.drinking = false;
      player.classList.remove('drinking');

      equippedBottle.qty = Math.max(0, equippedBottle.qty - 1);
      refreshAll();
    }, 900);
  }

    /* ============================================================
     BOMBA INCENDIARIA — lanzar / explotar / quemar
     ============================================================ */
  function useEquippedBottle() {
    const bottle = INVENTORY.bottle.slots[equipped.bottle];
    if (!bottle || bottle.qty <= 0) return;

    if (bottle.name === 'Frasco Vital') {
      drinkFlask();
    } else if (bottle.name === 'Bomba incendiaria') {
      throwBomb();
    }
  }

  function throwBomb() {
    if (p.dead) return;
    if (p.drinking) return;
    if (p.attacking || p.defending || p.dashing || p.parrying) return;
    if (p.stunTimer > 0) return;
    if (inventoryOpen || itemPickerOpen || pickupWindowOpen) return;

    const now = performance.now();
    if (now - p.lastBombThrow < BOMB_COOLDOWN) return;

    const bottle = INVENTORY.bottle.slots[equipped.bottle];
    if (!bottle) return;
    if (bottle.name !== 'Bomba incendiaria') return;
    if (bottle.qty <= 0) return;

    p.lastBombThrow = now;

    // Dirección: hacia donde apunta la flecha
    const startX = p.x + CH_W / 2;
    const startY = p.y + CH_H / 2;
    const dirX = Math.cos(p.aimAngle);
    const dirY = Math.sin(p.aimAngle);

    // Crear el elemento visual
    const el = document.createElement('div');
    el.className = 'bomb-projectile';
    world.appendChild(el);

    activeBombs.push({
      x: startX,
      y: startY,
      dirX, dirY,
      traveled: 0,
      el,
    });

    // Consumir 1 unidad
    bottle.qty = Math.max(0, bottle.qty - 1);

    // Si se agotó, desaparece del inventario
    if (bottle.qty <= 0) {
      INVENTORY.bottle.slots[equipped.bottle] = null;

      // Auto-equipar el siguiente slot que tenga algo
      if (!INVENTORY.bottle.slots[equipped.bottle]) {
        for (let i = 0; i < INVENTORY.bottle.slots.length; i++) {
          if (INVENTORY.bottle.slots[i]) {
            equipped.bottle = i;
            break;
          }
        }
      }
    }

    refreshAll();
  }

  function updateBombs(dt) {
    for (let i = activeBombs.length - 1; i >= 0; i--) {
      const b = activeBombs[i];

      const step = BOMB_THROW_SPEED * dt;
      b.x += b.dirX * step;
      b.y += b.dirY * step;
      b.traveled += step;

      // Arco visual (sube y baja)
      const t = Math.min(1, b.traveled / BOMB_MAX_RANGE);
      const arcY = -Math.sin(t * Math.PI) * 42;

      // Colocar el proyectil
      b.el.style.transform =
        `translate3d(${b.x - 9}px, ${b.y - 9 + arcY}px, 0)`;

            // ¿Choca con el enemigo?
      let hit = false;
      if (!e.dead) {
        const ecx = e.x + CH_W / 2;
        const ecy = e.y + CH_H / 2;
        const d = Math.hypot(b.x - ecx, b.y - ecy);
        if (d < 38) hit = true;
      }

      // ¿Choca con el jefe?
      if (!hit && !boss.dead && bossEl.style.display !== 'none') {
        const bcx = boss.x + CH_W / 2;
        const bcy = boss.y + CH_H / 2;
        const d = Math.hypot(b.x - bcx, b.y - bcy);
        if (d < BOSS_BODY_RADIUS + 8) hit = true;
      }

      // ¿Choca con un muro?
      if (!hit && entityOverlapsAnyWall(b.x - 4, b.y - 4, 8, 8)) {
        hit = true;
      }

      // ¿Se pasó del rango máximo?
      if (!hit && b.traveled >= BOMB_MAX_RANGE) hit = true;

      if (hit) {
        explodeBomb(b.x, b.y);
        b.el.remove();
        activeBombs.splice(i, 1);
      }
    }
  }

    function explodeBomb(x, y) {
    // Explosión visual
    const ex = document.createElement('div');
    ex.className = 'bomb-explosion';
    ex.style.left = x + 'px';
    ex.style.top  = y + 'px';
    world.appendChild(ex);
    setTimeout(() => ex.remove(), 650);

    const sw = document.createElement('div');
    sw.className = 'bomb-shockwave';
    sw.style.left = x + 'px';
    sw.style.top  = y + 'px';
    world.appendChild(sw);
    setTimeout(() => sw.remove(), 600);

    // Sacudida de pantalla suave
    viewport.animate(
      [
        { transform: 'translate(0, 0)' },
        { transform: 'translate(2px, -3px)' },
        { transform: 'translate(-2px, 1px)' },
        { transform: 'translate(0, 0)' },
      ],
      { duration: 180, easing: 'ease-out' }
    );

    // ---------- Daño al enemigo normal ----------
    if (!e.dead) {
      const ecx = e.x + CH_W / 2;
      const ecy = e.y + CH_H / 2;
      const d = Math.hypot(x - ecx, y - ecy);

      if (d <= BOMB_RADIUS) {
        // Falloff: 100% en el centro, 55% en el borde
        const falloff = 1 - (d / BOMB_RADIUS) * 0.45;
        const dmg = Math.round(BOMB_DAMAGE * falloff);

        // El escudo NO la bloquea (el fuego traspasa la guardia)
        e.hp = Math.max(0, e.hp - dmg);
        flashHurt(enemy);
        spawnDamageNumber(enemy, dmg, { prefix: '💥 ' });

        if (e.hp <= 0) {
          killEntity(e, enemy);
        } else {
          // Aplicar quemadura
          e.burnTimer = BOMB_BURN_DURATION;
          e.burnTick  = 0;
          enemy.classList.add('burning');

          // Pequeño stun de impacto (0.6 s)
          if (e.stunTimer <= 0) {
            e.stunTimer = 0.6;
            e.defending = false;
            e.attacking = false;
            e.currentAttack = null;
            e.moving = false;
            enemy.classList.remove('defending', 'attacking', 'moving');
            enemy.classList.add('stunned');
          }
        }
      }
    }

    // ---------- Daño al jefe ----------
    if (!boss.dead && bossEl.style.display !== 'none') {
      const bcx = boss.x + CH_W / 2;
      const bcy = boss.y + CH_H / 2;
      const d = Math.hypot(x - bcx, y - bcy);

      // El jefe es más grande, así que ampliamos un poco el radio
      const bossRadius = BOMB_RADIUS + BOSS_BODY_RADIUS * 0.5;

      if (d <= bossRadius) {
        const falloff = 1 - (d / bossRadius) * 0.45;
        const dmg = Math.round(BOMB_DAMAGE * falloff);
        damageBoss(dmg);
      }
    }
  }



  /* ============================================================
     PARRY
     ============================================================ */
  function enemyIsMidSwing() {
    if (e.dead || !e.attacking || !e.currentAttack) return false;
    const elapsed = performance.now() - e.attackStart;
    return elapsed >= 0 && elapsed <= e.currentAttack.duration * 0.42;
  }

  function succeedParry() {
    if (p.parrySuccess || e.dead) return;
    p.parrySuccess = true;

    e.attackParried = true;
    applyStun(AI.stunDuration);
    spawnDamageNumber(enemy, 'PARRY!', { parry: true });

    player.classList.add('parry-success');
    setTimeout(() => player.classList.remove('parry-success'), 460);
  }

  function triggerParry() {
    if (p.dead) return;
    if (p.drinking) return;
    if (p.stunTimer > 0) return;
    if (p.parrying) return;
    if (p.dashing) return;
    if (p.attacking) return;
    if (p.parryCooldown > 0) return;
    if (!INVENTORY.shield.slots[equipped.shield]) return;

    if (p.defending) setDefending(false);

    p.parrying = true;
    p.parrySuccess = false;
    p.parryCooldown = PARRY_COOLDOWN / 1000;

    player.classList.remove('parrying', 'parry-success');
    void player.offsetWidth;
    player.classList.add('parrying');

    faceEntity(p, e, playerFlip);

    if (enemyIsMidSwing() && distanceBetween(p, e) <= PARRY_RANGE) {
      succeedParry();
    }

    setTimeout(() => {
      player.classList.remove('parrying');
      p.parrying = false;
    }, PARRY_MS);
  }

  /* ============================================================
     DASH
     ============================================================ */
  function triggerDash() {
    if (p.dead) return;
    if (p.stunTimer > 0) return;
    if (p.dashing) return;
    if (p.dashCooldown > 0) return;
    if (p.defending) return;
    if (p.parrying) return;
    if (p.stamina < STAMINA_DASH_COST) return;

    p.stamina = Math.max(0, p.stamina - STAMINA_DASH_COST);
    p.staminaPause = STAMINA_HIT_PAUSE;

    let dx = 0, dy = 0;
    if (keys.left)  dx -= 1;
    if (keys.right) dx += 1;
    if (keys.up)    dy -= 1;
    if (keys.down)  dy += 1;

    if (dx === 0 && dy === 0) {
      dx = p.dir;
      dy = 0;
    }

    const len = Math.hypot(dx, dy) || 1;
    p.dashDirX = dx / len;
    p.dashDirY = dy / len;

    p.dashing = true;
    p.dashTimer = DASH_DURATION;
    p.dashCooldown = DASH_COOLDOWN;

    player.classList.add('dashing');

    if (Math.abs(p.dashDirX) > 0.05 && !lockedOn) {
      const newDir = p.dashDirX > 0 ? 1 : -1;
      if (newDir !== p.dir) {
        p.dir = newDir;
        playerFlip.style.transform = p.dir === -1 ? 'scaleX(-1)' : 'scaleX(1)';
      }
    }
  }

  /* ============================================================
     LOCK-ON — utilidades
     ============================================================ */
  function getLockedTarget() {
    if (!lockedOn) return null;
    if (lockedTarget === 'enemy') {
      if (!e.dead) return e;
      return null;
    }
    if (lockedTarget === 'boss') {
      if (!boss.dead && bossEl.style.display !== 'none') return boss;
      return null;
    }
    return null;
  }


  /* ============================================================
     LOCK-ON
     ============================================================ */
    function toggleLock() {
    if (p.dead) return;

    // Si ya hay lock, lo soltamos
    if (lockedOn) {
      releaseLock();
      return;
    }

    // Buscar candidatos válidos
    const candidates = [];

    if (!e.dead) {
      candidates.push({
        target: 'enemy',
        dist:   distanceBetween(p, e),
        el:     enemy,
      });
    }
    if (!boss.dead && bossEl.style.display !== 'none') {
      candidates.push({
        target: 'boss',
        dist:   distanceBetween(p, boss),
        el:     bossEl,
      });
    }

    if (candidates.length === 0) return;

    // Elegir el más cercano
    candidates.sort((a, b) => a.dist - b.dist);
    const best = candidates[0];

    lockedTarget = best.target;
    lockedOn     = true;

    best.el.classList.add('locked');
    player.classList.add('locked-aim');
  }

  function releaseLock() {
    if (!lockedOn && !lockedTarget) return;

    lockedOn     = false;
    lockedTarget = null;

    enemy.classList.remove('locked');
    bossEl.classList.remove('locked');
    player.classList.remove('locked-aim');
  }

  /* ============================================================
     COLISIÓN JUGADOR vs ENEMIGO
     ============================================================ */
  function resolvePlayerEnemyCollision() {
    if (p.dead || e.dead) return;
    if (p.dashing) return;

    const cp = centerOf(p);
    const ce = centerOf(e);

    let dx = cp.x - ce.x;
    let dy = cp.y - ce.y;
    let dist = Math.hypot(dx, dy);

    if (dist === 0) { dx = 1; dy = 0; dist = 0.001; }

    if (dist < MIN_DISTANCE) {
      const overlap = (MIN_DISTANCE - dist) / 2;
      const nx = dx / dist;
      const ny = dy / dist;

      p.x += nx * overlap;
      p.y += ny * overlap;
      e.x -= nx * overlap;
      e.y -= ny * overlap;

      p.x = clamp(p.x, 0, WORLD_SIZE - CH_W);
      p.y = clamp(p.y, 0, WORLD_SIZE - CH_H);
      e.x = clamp(e.x, 0, WORLD_SIZE - CH_W);
      e.y = clamp(e.y, 0, WORLD_SIZE - CH_H);
    }
  }

    /* ============================================================
     COLISIÓN JUGADOR vs JEFE
     ============================================================ */
  /* ============================================================
     COLISIÓN JUGADOR vs JEFE
     ============================================================ */
  function resolvePlayerBossCollision() {
    if (p.dead || boss.dead) return;
    if (bossEl.style.display === 'none') return;
    if (p.dashing) return;

    const cp = centerOf(p);
    const cb = centerOf(boss);

    let dx = cp.x - cb.x;
    let dy = cp.y - cb.y;
    let dist = Math.hypot(dx, dy);

    if (dist === 0) { dx = 1; dy = 0; dist = 0.001; }

    const minDist = BODY_RADIUS + BOSS_BODY_RADIUS;

    if (dist < minDist) {
      const overlap = (minDist - dist);
      const nx = dx / dist;
      const ny = dy / dist;

      // --- 1) Intentar empujar al jefe la mitad del solape ---
      const oldBossX = boss.x;
      const oldBossY = boss.y;

      boss.x -= nx * (overlap / 2);
      boss.y -= ny * (overlap / 2);
      boss.x = clamp(boss.x, 0, WORLD_SIZE - CH_W);
      boss.y = clamp(boss.y, 0, WORLD_SIZE - CH_H);

      // Resolver colisión del jefe contra muros (esto puede devolverlo)
      resolveEntityWallCollision(boss, CH_W, CH_H);

      // Cuánto se movió realmente el jefe
      const realBossDx = boss.x - oldBossX;
      const realBossDy = boss.y - oldBossY;

      // --- 2) El jugador absorbe el resto del empuje ---
      //     (si el jefe no pudo moverse por la pared, el jugador
      //      retrocede todo lo que el jefe no pudo)
      p.x += nx * (overlap / 2) + (nx * overlap / 2 - realBossDx);
      p.y += ny * (overlap / 2) + (ny * overlap / 2 - realBossDy);

      p.x = clamp(p.x, 0, WORLD_SIZE - CH_W);
      p.y = clamp(p.y, 0, WORLD_SIZE - CH_H);

      // Resolver colisión del jugador contra muros también
      resolveEntityWallCollision(p, CH_W, CH_H);
    }
  }

  /* ============================================================
     NÚMEROS DE DAÑO

    function spawnDamageNumber(targetEl, amount, options = {}) {
    const el = document.createElement('div');

    if (options.crit) el.classList.add('crit');

    el.style.left = '50%';

  }

  /* ============================================================
     INTERRUPCIÓN POR ESTABILIDAD
     ============================================================ */
  function tryInterruptEnemyAttack(damageFromPlayer) {
    if (!e.attacking || e.dead) return;
    if (!e.currentAttack) return;

    let mult = playerHitsFromBehind() ? BACKSTAB_MULT : FRONTAL_MULT;
    const power = damageFromPlayer * mult;

    e.stability = Math.max(0, e.stability - power);

    if (e.stability <= 0) {
      e.attacking = false;
      e.currentAttack = null;
      enemy.classList.remove('attacking');
      e.state = 'idle';
      e.stateTime = 0;
      e.attackPause = AI.attackSpacing;
    }
  }

  /* ============================================================
     DAÑO / MUERTE
     ============================================================ */
  function damagePlayer(amount) {
    if (p.dead) return;
    const hasShield = !!INVENTORY.shield.slots[equipped.shield];
    const defended = p.defending && hasShield;
    let final = defended ? PLAYER_DMG_DEFENDED : amount;

    p.hp = Math.max(0, p.hp - final);
    flashHurt(player);
    spawnDamageNumber(player, final, { defended, prefix: defended ? '🛡 ' : '' });

        if (defended) {
      p.staminaPause = STAMINA_HIT_PAUSE;
      p.stamina = Math.max(0, p.stamina - STAMINA_BLOCK_COST);

      // Cuenta el bloqueo. Al alcanzar el número sorteado, estunea al enemigo
      p.blocksWhileDefending++;
      if (p.blocksWhileDefending >= p.blocksToStunThisDefense) {
        applyStun(AI.stunDuration);
        spawnDamageNumber(enemy, 'RIPOSTE!', { parry: true });
        p.blocksWhileDefending = 0;
        p.blocksToStunThisDefense = Math.random() < 0.5 ? 1 : 2;
      }
    }

    if (p.hp <= 0) killEntity(p, player);
  }

  function damageEnemy(amount) {
    if (e.dead) return;

      if (e.defending && e.stunTimer <= 0) {
    e.hitsWhileDefending++;
    if (e.hitsWhileDefending >= e.hitsToStunThisDefense) {
      applyStun(AI.stunDuration);
    }
  } else if (!e.defending && e.stunTimer <= 0 && e.stunImmunity <= 0) {
    // ---- Sin escudo: stun directo ----
    applyStun(AI.stunDuration);
    e.stunImmunity = 1.6;   // 1.6s de gracia para que no lo stunees en cadena
  }

    tryInterruptEnemyAttack(amount);

    e.hp = Math.max(0, e.hp - amount);
    flashHurt(enemy);
    spawnDamageNumber(enemy, amount);

    

    if (e.hp <= 0) killEntity(e, enemy);
  }

   /* ============================================================
     JEFE — comprobación de arco del jugador
     ============================================================ */
  function bossIsInAttackArc() {
    if (boss.dead) return false;
    if (bossEl.style.display === 'none') return false;

    const pcx = p.x + CH_W / 2;
    const pcy = p.y + CH_H / 2;
    const bcx = boss.x + CH_W / 2;
    const bcy = boss.y + CH_H / 2;
    const angleToBoss = Math.atan2(bcy - pcy, bcx - pcx);

    let diff = angleToBoss - p.aimAngle;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;

    return Math.abs(diff) <= ATTACK_ARC / 2;
  }

  /* ============================================================
     JEFE — daño y muerte
     ============================================================ */
   function damageBoss(amount) {
    if (boss.dead) return;
    if (bossEl.style.display === 'none') return;
    if (amount <= 0) return;

    boss.hp = Math.max(0, boss.hp - amount);
    flashHurt(bossEl);
    spawnDamageNumber(bossEl, amount);   // ← sin prefijo (como pediste)

    updateBossHPBar();

    if (boss.hp <= 0) {
      killBoss();
      return;
    }

    // ---------- Acumulación para stagger ----------
    // Si ya está aturdido, no acumulamos más
    if (boss.state !== 'stagger') {
      const now = performance.now();

      // Si la ventana de acumulación ha expirado, reiniciar
      if (now - boss.recentDamageTime > BOSS_STAGGER_WINDOW) {
        boss.recentDamage = 0;
      }

      boss.recentDamage += amount;
      boss.recentDamageTime = now;

      // ¿Ha superado el umbral para aturdirse?
      if (boss.recentDamage >= BOSS_STAGGER_DAMAGE) {
        applyBossStagger(BOSS_STAGGER_DURATION);
      }
    }
  }

  /* ============================================================
     JEFE — stagger (aturdimiento por daño acumulado)
     ============================================================
     Se dispara cuando el jugador acumula BOSS_STAGGER_DAMAGE en
     BOSS_STAGGER_WINDOW ms. Cancela el ataque en curso, resetea
     el pathfinding y deja al jefe vulnerable durante un instante.
     ============================================================ */
  function applyBossStagger(duration) {
    if (boss.dead) return;
    if (boss.state === 'stagger') return;   // ya aturdido

    // ---------- Cancelar ataque en curso ----------
    hideBossTelegraph();
    bossEl.classList.remove('telegraphing', 'attacking', 'dashing', 'jumping');

    boss.currentAttack  = null;
    boss.comboSteps     = null;
    boss.comboTotalMs   = 0;
    boss.attackHit      = false;
    boss.dashing        = false;
    boss.jumping        = false;
    boss.jumpProgress   = 0;
    boss.attackMoveSpeed = 0;

    // ---------- Resetear pathfinding ----------
    boss.path = [];
    boss.pathIndex = 0;
    boss.pathTimer = 0;

    // ---------- Aplicar stagger ----------
    boss.state         = 'stagger';
    boss.stateTime     = 0;
    boss.staggerTimer  = duration;         // ms que dura
    boss.recentDamage  = 0;                // el contador se vacía
    boss.recentDamageTime = performance.now();

    // Pequeño respiro antes de poder atacar de nuevo
    boss.lastAttackEnd  = performance.now();
    boss.attackCooldown = 500;

    stopBoss();
    bossEl.classList.add('stagger', 'stunned');
  }

  function killBoss() {
    if (boss.dead) return;
    boss.dead = true;
    boss.detected = false;

    // Limpiar el estado por completo
    boss.state = 'dead';
    boss.currentAttack = null;
    boss.comboSteps = null;
    boss.dashing = false;
    boss.jumping = false;
    boss.attackHit = false;

    // Quitar clases y añadir .dead
    bossEl.classList.remove(
      'attacking', 'telegraphing', 'dashing',
      'jumping', 'stagger', 'stunned', 'moving', 'hurt'
    );
    bossEl.classList.add('dead');

       hideBossTelegraph();
    bossHpBar.classList.remove('visible');

    // Soltar el lock-on si estaba bloqueado sobre él
    if (lockedTarget === 'boss') releaseLock();
  }

  function flashHurt(el) {

  function killEntity(state, el) {

    state.defending = false;

  /* ============================================================

  function applyStun(duration) {

  /* ============================================================
     ATAQUES DEL JUGADOR
     ============================================================ */
  function triggerPlayerAttack() {
    if (p.attacking || p.defending || p.dead || p.dashing || p.parrying || p.drinking) return;
    if (p.stunTimer > 0) return;
    if (!INVENTORY.sword.slots[equipped.sword]) return;

    const now = performance.now();
    if (now - p.lastAttackEnd < ATTACK_COOLDOWN - ATTACK_MS) return;

    if (p.stamina < STAMINA_ATTACK_COST) {
      applyPlayerStun(PLAYER_STUN_DURATION);
      return;
    }

    p.stamina = Math.max(0, p.stamina - STAMINA_ATTACK_COST);
    p.staminaPause = STAMINA_HIT_PAUSE;

    p.attacking = true;
    p.lastAttackEnd = now;

    player.classList.remove('attacking');
    void player.offsetWidth;
    player.classList.add('attacking');

        setTimeout(() => {
      // ----- Golpear al enemigo normal -----
      if (!e.dead &&
          distanceBetween(p, e) <= ATTACK_RANGE &&
          enemyIsInAttackArc()) {
        damageEnemy(PLAYER_DMG);
      }

      // ----- Golpear al jefe (si está activo y en rango) -----
      if (!boss.dead &&
          bossEl.style.display !== 'none' &&
          distanceBetween(p, boss) <= ATTACK_RANGE + BOSS_BODY_RADIUS &&
          bossIsInAttackArc()) {
        damageBoss(PLAYER_DMG);
      }
    }, ATTACK_MS * 0.42);

    setTimeout(() => {
      player.classList.remove('attacking');
      p.attacking = false;
    }, ATTACK_MS);
  }

  /* ============================================================
     SELECCIÓN DE ATAQUE DEL ENEMIGO
     ============================================================ */
  function pickEnemyAttack(dist) {
    if (Math.random() < 0.3) {
      return Math.floor(Math.random() * ENEMY_ATTACKS.length);
    }

    const scores = ENEMY_ATTACKS.map((atk, i) => {
      let s = 0;

      if (dist < 70) s += (ENEMY_ATTACKS.length - i) * 3;
      else if (dist < 110) s += (i === 1 || i === 2) ? 3 : 0;
      else s += i * 2;

      if (p.attacking) s += (ENEMY_ATTACKS.length - i) * 2;
      if (p.defending) s += i * 2.5;
      if (p.hp < 30) s += i * 2;
      s += Math.random() * 2;

      return s;
    });

    let bestI = 0;
    for (let i = 1; i < scores.length; i++) {
      if (scores[i] > scores[bestI]) bestI = i;
    }
    return bestI;
  }

  /* ============================================================
     ATAQUE DEL ENEMIGO
     ============================================================ */
  function triggerEnemyAttack() {
    if (e.attacking || e.dead || e.stunTimer > 0) return;
    const now = performance.now();
    if (now - e.lastAttackEnd < ENEMY_ATTACK_COOLDOWN) return;

    const dist = distanceBetween(p, e);
    const attackIndex = pickEnemyAttack(dist);
    const attack = ENEMY_ATTACKS[attackIndex];

    e.attacking = true;
    e.currentAttack = attack;
    e.currentAttackIndex = attackIndex;
    e.lastAttackEnd = now;
    e.attackStart = now;
    e.attackParried = false;
    e.attackPause = AI.attackSpacing;

    enemy.style.setProperty('--attack-ms', attack.duration + 'ms');

    enemy.classList.remove('attacking');
    void enemy.offsetWidth;
    enemy.classList.add('attacking');

    setTimeout(() => {
      if (e.attackParried) return;
      if (!e.attacking) return;
      if (p.dead) return;
      if (p.drinking) return;
      if (distanceBetween(p, e) > ATTACK_RANGE) return;

      if (p.parrying) {
        succeedParry();
      } else {
        damagePlayer(attack.damage);
      }
    }, attack.duration * 0.42);

    setTimeout(() => {
      enemy.classList.remove('attacking');
      e.attacking = false;
      e.currentAttack = null;
    }, attack.duration);
  }

  /* ============================================================

    function setDefending(value) {
    if (p.drinking) value = false;  
    if (p.dead) value = false;
    if (p.stunTimer > 0) value = false;
    if (p.dashing) value = false;
    if (p.parrying) value = false;
    if (!INVENTORY.shield.slots[equipped.shield]) value = false;
    if (p.defending === value) return;
    p.defending = value;
    player.classList.toggle('defending', p.defending);
    viewport.style.cursor = p.defending ? 'grabbing' : 'crosshair';

    // Al empezar a defender, sortear cuántos bloqueos aguanta el enemigo
    if (p.defending) {
      p.blocksWhileDefending = 0;
      p.blocksToStunThisDefense = Math.random() < 0.5 ? 1 : 2;
    } else {
      p.blocksWhileDefending = 0;
    }
  }

  /* ============================================================
     DEFENSA DEL ENEMIGO
     ============================================================ */
  function handleEnemyDefense(dt, dist) {
    if (e.dead || e.stunTimer > 0) return;

    const threats = p.attacking && dist < AI.defendRange;

    if (threats) {
      e.defendIntent += dt;
      if (e.defendIntent >= AI.defendDelay && !e.defending) {
        e.defending = true;
        e.hitsToStunThisDefense = 2;
        enemy.classList.add('defending');
        e.defendHold = AI.defendHoldTime;
        e.defendIntent = 0;
      }
      if (e.defending) e.defendHold = AI.defendHoldTime;
    } else {
      e.defendIntent = Math.max(0, e.defendIntent - dt * 2);
      if (e.defending) {
        e.defendHold -= dt;
        if (e.defendHold <= 0) {
          e.defending = false;
          e.hitsWhileDefending = 0;
          enemy.classList.remove('defending');
        }
      }
    }
  }

  /* ============================================================
     SELECCIÓN DE ESTADO
     ============================================================ */
  function chooseEnemyState(dist, now) {
    if (dist < AI.attackRange && now - e.lastAttackEnd >= ENEMY_ATTACK_COOLDOWN) {
      return 'attack';
    }
    if (dist < AI.attackRange + 40 && now - e.lastAttackEnd < ENEMY_ATTACK_COOLDOWN) {
      return Math.random() < 0.5 ? 'flank' : 'chase';
    }
    if (dist < AI.detectRange) {
      if (dist > AI.flankMinDist && dist < AI.flankMaxDist) {
        return Math.random() < 0.55 ? 'flank' : 'chase';
      }
      return 'chase';
    }
    return 'idle';
  }

  /* ============================================================
     MOVIMIENTO DEL ENEMIGO
     ============================================================ */
  function moveEnemyBy(dirX, dirY, speed, dt) {
    const len = Math.hypot(dirX, dirY) || 1;
    const nx = dirX / len;
    const ny = dirY / len;

    e.x += nx * speed * dt;
    e.y += ny * speed * dt;
    e.x = clamp(e.x, 0, WORLD_SIZE - CH_W);
    e.y = clamp(e.y, 0, WORLD_SIZE - CH_H);

    resolveEntityWallCollision(e, CH_W, CH_H);

    if (Math.abs(nx) > 0.05) {
      const nd = nx > 0 ? 1 : -1;
      if (nd !== e.dir) {
        e.dir = nd;
        enemyFlip.style.transform = e.dir === -1 ? 'scaleX(-1)' : 'scaleX(1)';
      }
    }

    if (!e.moving) {
      e.moving = true;
      enemy.classList.add('moving');
    }
  }

  function stopEnemy() {
    if (e.moving) {
      e.moving = false;
      enemy.classList.remove('moving');
    }
  }

  

  function moveEnemyToward(tx, ty, speed, dt) {
    const c = centerOf(e);
    moveEnemyBy(tx - c.x, ty - c.y, speed, dt);
  }

    /* ============================================================

  function faceBossToPlayer() {
    const cb = centerOf(boss);

    const newDir = cp.x >= cb.x ? 1 : -1;

      boss.dir = newDir;

  function moveBossBy(dirX, dirY, speed, dt) {

    const nx = dirX / len;
    const ny = dirY / len;

    boss.x += nx * speed * dt;

  function stopBoss() {

  }

  function moveBossToward(tx, ty, speed, dt) {
    const c = centerOf(boss);
    moveBossBy(tx - c.x, ty - c.y, speed, dt);
  }

  function moveBossToTarget(tx, ty, speed, dt) {
    const c = centerOf(boss);

    // Visión directa → línea recta
    if (hasLineOfSight(c.x, c.y, tx, ty)) {
      boss.path = [];
      boss.pathIndex = 0;
      boss.pathTimer = 0;
      moveBossToward(tx, ty, speed, dt);
      return;
    }

    // Recalcular ruta cada 0.35 s
    boss.pathTimer -= dt;
    if (boss.path.length === 0 || boss.pathTimer <= 0) {
      const path = findNavPath(c.x, c.y, tx, ty);
      if (path && path.length > 0) {
        boss.path = path;
        boss.pathIndex = 0;
      } else {
        moveBossToward(tx, ty, speed, dt);
        boss.pathTimer = 0.35;
        return;
      }
      boss.pathTimer = 0.35;
    }

    // Descartar waypoints ya alcanzados
    while (boss.pathIndex < boss.path.length - 1) {
      const wp = boss.path[boss.pathIndex];
      const d = Math.hypot(wp.x - c.x, wp.y - c.y);
      if (d < NAV_CELL * 0.9) boss.pathIndex++;
      else break;
    }

    // Suavizado: apuntar al waypoint más lejano visible
    let aimIdx = boss.pathIndex;
    for (let i = boss.path.length - 1; i >= boss.pathIndex; i--) {
      const wp = boss.path[i];
      if (hasLineOfSight(c.x, c.y, wp.x, wp.y)) {
        aimIdx = i;
        break;
      }
    }
    boss.pathIndex = aimIdx;

    const wp = boss.path[aimIdx];
    moveBossToward(wp.x, wp.y, speed, dt);
  }

  /* ============================================================
     JEFE — detección y barra de vida
     ============================================================ */
  function updateBossProximity() {
    if (boss.dead || bossEl.style.display === 'none') {
      boss.detected = false;
      bossHpBar.classList.remove('visible');
      return;
    }

    const dist = distanceBetween(p, boss);

    if (dist < BOSS_DETECT_RANGE) {
      boss.detected = true;
    } else if (dist > BOSS_LOSE_RANGE) {
      boss.detected = false;
    }

    updateBossHPBar();
  }

  function updateBossHPBar() {
    const hpPct = Math.max(0, boss.hp / boss.maxHp) * 100;
    bossHpFill.style.width = hpPct + '%';

  /* Movimiento inteligente: usa A* cuando no hay línea de visión */
function moveEnemyToTarget(tx, ty, speed, dt) {
  const c = centerOf(e);

  // Si hay visión directa, ir en línea recta (más natural)
  if (hasLineOfSight(c.x, c.y, tx, ty)) {
    e.path = [];
    e.pathIndex = 0;
    e.pathTimer = 0;
    moveEnemyToward(tx, ty, speed, dt);
    return;
  }

  // Recalcular ruta cada 0.35s
  e.pathTimer -= dt;
  if (e.path.length === 0 || e.pathTimer <= 0) {
    const path = findNavPath(c.x, c.y, tx, ty);
    if (path && path.length > 0) {
      e.path = path;
      e.pathIndex = 0;
    } else {
      // Sin ruta: fallback a movimiento directo
      moveEnemyToward(tx, ty, speed, dt);
      e.pathTimer = 0.35;
      return;
    }
    e.pathTimer = 0.35;
  }

  // Descartar waypoints ya alcanzados
  while (e.pathIndex < e.path.length - 1) {
    const wp = e.path[e.pathIndex];
    const d = Math.hypot(wp.x - c.x, wp.y - c.y);
    if (d < NAV_CELL * 0.9) e.pathIndex++;
    else break;
  }

  // Suavizado: apuntar al waypoint más lejano visible desde aquí
  let aimIdx = e.pathIndex;
  for (let i = e.path.length - 1; i >= e.pathIndex; i--) {
    const wp = e.path[i];
    if (hasLineOfSight(c.x, c.y, wp.x, wp.y)) {
      aimIdx = i;
      break;
    }
  }
  e.pathIndex = aimIdx;

  const wp = e.path[aimIdx];
  moveEnemyToward(wp.x, wp.y, speed, dt);
}

  /* ============================================================
     EJECUCIÓN DE ESTADOS
     ============================================================ */
  function executeEnemyState(state, dist, dt, now) {
    switch (state) {
            case 'idle': {
        // Sin deambulación: el enemigo se queda quieto hasta detectar al jugador
        stopEnemy();
        break;
      }
      case 'chase': {
  const target = centerOf(p);
  moveEnemyToTarget(target.x, target.y, ENEMY_SPEED, dt);
  break;
}
case 'flank': {
  const ce = centerOf(e);
  const cp = centerOf(p);
  const toPx = cp.x - ce.x;
  const toPy = cp.y - ce.y;
  const d = Math.hypot(toPx, toPy) || 1;
  const nx = toPx / d;
  const ny = toPy / d;

  const perpX = -ny * e.circleDir;
  const perpY =  nx * e.circleDir;

  const targetX = cp.x - nx * AI.flankRadius + perpX * AI.flankRadius * 0.75;
  const targetY = cp.y - ny * AI.flankRadius + perpY * AI.flankRadius * 0.75;

  moveEnemyToTarget(targetX, targetY, ENEMY_SPEED, dt);
  break;
}
      case 'attack': {
        stopEnemy();
        faceEntity(e, p, enemyFlip);
        triggerEnemyAttack();
        break;
      }
    }
  }

  /* ============================================================
     ACTUALIZACIÓN DE LA IA
     ============================================================ */
  function updateEnemyAI(dt, now) {
    if (e.dead) return;

    if (e.stunImmunity > 0) e.stunImmunity = Math.max(0, e.stunImmunity - dt);

        // ----- Quemadura -----
    if (e.burnTimer > 0) {
      e.burnTimer -= dt;
      e.burnTick += dt;

      if (e.burnTick >= 0.5) {
        e.burnTick -= 0.5;
        const dmg = Math.round(BOMB_BURN_DPS * 0.5);
        e.hp = Math.max(0, e.hp - dmg);
        spawnDamageNumber(enemy, dmg, { prefix: '🔥 ' });

        if (e.hp <= 0) {
          e.burnTimer = 0;
          enemy.classList.remove('burning');
          killEntity(e, enemy);
          return;
        }
      }

      if (e.burnTimer <= 0) {
        enemy.classList.remove('burning');
      }
    }


    if (!e.attacking && e.stability < e.stabilityMax) {
      e.stability = Math.min(e.stabilityMax, e.stability + STABILITY_REGEN * dt);
    }

    if (e.stunTimer > 0) {
      e.stunTimer -= dt;
      stopEnemy();
      if (e.stunTimer <= 0) endStun();
      return;
    }

    const dist = distanceBetween(p, e);

    handleEnemyDefense(dt, dist);
    if (e.defending) {
      stopEnemy();
      faceEntity(e, p, enemyFlip);
      return;
    }

    if (e.attackPause > 0) e.attackPause -= dt;

    e.stateTime += dt;

    const canReevaluate =
      e.stateTime >= AI.stateCommitTime &&
      e.attackPause <= 0 &&
      !e.attacking;

    if (canReevaluate) {
      const newState = chooseEnemyState(dist, now);
      if (newState !== e.state) {
        if (newState === 'flank' && Math.random() < 0.5) {
          e.circleDir *= -1;
        }
        e.state = newState;
        e.stateTime = 0;
      }
    }

    executeEnemyState(e.state, dist, dt, now);
  }

      function checkBossHitbox(attack, damageOverride) {
    if (p.dead) return false;

    // El daño real puede venir por parámetro (combos) o del ataque
    const dmg = (damageOverride != null) ? damageOverride : attack.damage;
    if (!dmg || dmg <= 0) return false;

    const cb = centerOf(boss);
    const cp = centerOf(p);
    const dx = cp.x - cb.x;
    const dy = cp.y - cb.y;
    const dist = Math.hypot(dx, dy);

    // attack.range se mide desde el BORDE del cuerpo del jefe.
    // Para comparar con la distancia entre centros hay que sumar
    // el radio del cuerpo (BOSS_BODY_RADIUS = 44).
    const maxReach = attack.range + BOSS_BODY_RADIUS;

    let hit = false;

    if (attack.hitboxShape === 'cone') {
      // Cono: rango + ángulo
      if (dist > maxReach) return;

      const angleToPlayer = Math.atan2(dy, dx);
      const facingAngle = boss.dir === 1 ? 0 : Math.PI;

      let diff = angleToPlayer - facingAngle;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;

      hit = Math.abs(diff) <= attack.arc / 2;

    } else if (attack.hitboxShape === 'circle') {
      // Círculo: solo rango
      hit = dist <= maxReach;

        } else if (attack.hitboxShape === 'rect') {
      // Rectángulo: cono frontal estrecho (embestida)
      if (dist > maxReach) return false;

      const angleToPlayer = Math.atan2(dy, dx);
      const facingAngle = boss.dir === 1 ? 0 : Math.PI;

      let diff = angleToPlayer - facingAngle;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;

      const arc = attack.arc || 0.8;
      hit = Math.abs(diff) <= arc / 2;
    }

    if (!hit) return;

        // Aplicar daño (damagePlayer ya aplica la reducción del escudo)
    damagePlayer(dmg);

        // Aplicar empuje (knockback)
    if (attack.knockback && attack.knockback > 0 && dist > 0.001) {
      const nx = dx / dist;
      const ny = dy / dist;
      p.x += nx * attack.knockback;
      p.y += ny * attack.knockback;
      p.x = clamp(p.x, 0, WORLD_SIZE - CH_W);
      p.y = clamp(p.y, 0, WORLD_SIZE - CH_H);
      resolveEntityWallCollision(p, CH_W, CH_H);
    }
    return true;
  }

  /* ============================================================
     JEFE — inicio / fin de ataque
     ============================================================ */
    function startBossAttack(attack) {
    // Orientarse hacia el jugador ANTES de fijar la dirección
    faceBossToPlayer();
    boss.attackDirection = boss.dir;

    boss.state        = 'telegraph';
    boss.stateTime    = 0;
    boss.currentAttack = attack;
    boss.attackHit    = false;
    boss.attackStart  = performance.now();

    // ---------- Precalcular timeline si es combo ----------
    boss.comboSteps   = null;
    boss.comboTotalMs = 0;

    if (attack.type === 'combo' && attack.comboSteps && attack.comboSteps.length > 0) {
      boss.comboSteps = [];
      let t = 0;
      for (let i = 0; i < attack.comboSteps.length; i++) {
        const step = attack.comboSteps[i];
        t += step.gapBefore || 0;
        const startAt = t;
        const hitAt   = t + step.active * 0.42;
        const endAt   = t + step.active;
        boss.comboSteps.push({
          stepIndex: i,
          startAt,
          hitAt,
          endAt,
          damage: step.damage,
          started: false,
          hit: false,
        });
        t = endAt;
      }
      boss.comboTotalMs = t;
    }

       // ---------- Preparar movimiento especial ----------
    boss.dashing = false;
    boss.jumping = false;
    boss.jumpProgress = 0;
    boss.attackMoveSpeed = 0;

    if (attack.movement === 'forward') {
      // Embestida: velocidad = distancia / duración de la fase activa
      boss.attackMoveSpeed = (attack.moveDistance || 200) / (attack.active / 1000);
      boss.dashing = true;

    } else if (attack.movement === 'jump') {
      const cbx = centerOf(boss);
      let tx = cbx.x, ty = cbx.y;

      if (attack.moveDistance > 0) {
        // Salto hacia el jugador
        const cpx = centerOf(p);
        const dx = cpx.x - cbx.x;
        const dy = cpx.y - cbx.y;
        const d  = Math.hypot(dx, dy) || 1;
        const step = Math.min(attack.moveDistance, d);
        tx = cbx.x + (dx / d) * step;
        ty = cbx.y + (dy / d) * step;
      } else {
        // Salto hacia atrás (retroceso)
        const back = -attack.moveDistance;
        tx = cbx.x - boss.dir * back;
        ty = cbx.y;
      }

      boss.jumpStartX   = cbx.x;
      boss.jumpStartY   = cbx.y;
      boss.jumpTargetX  = tx;
      boss.jumpTargetY  = ty;
      boss.jumpProgress = 0;
      boss.jumping = true;
    }

    showBossTelegraph(attack);

    bossEl.classList.remove('attacking', 'dashing', 'jumping');
    bossEl.classList.add('telegraphing');
  }

  function endBossAttack() {
    if (!boss.currentAttack) return;

    boss.lastAttackId     = boss.currentAttack.id;
    boss.lastAttackEnd    = performance.now();
    boss.attackCooldown   = boss.currentAttack.cooldown || 0;

        hideBossTelegraph();
    bossEl.classList.remove('telegraphing', 'attacking', 'dashing', 'jumping');

    boss.dashing = false;
    boss.jumping = false;
    boss.jumpProgress = 0;

    boss.currentAttack = null;
    boss.state     = 'idle';
    boss.stateTime = 0;
  }

  /* ============================================================
     JEFE — elección de ataque (sistema de puntuación)
     ============================================================
     Paso 9.1: solo ataques estáticos (movement 'none').
     Los combos y ataques con movimiento vendrán después.
     ============================================================ */
      const BOSS_IMPLEMENTED_ATTACK_IDS = [
    'horiz_short',
    'horiz_wide',
    'vertical',
    'descending',
    'impact_slam',
    'combo_2',
    'combo_3',
    'charge_body',
    'jump_slash',
    'jump_back',
  ];
  function pickBossAttack(dist) {
    const now = performance.now();

    // Cooldown entre ataques
    if (now - boss.lastAttackEnd < (boss.attackCooldown || 0)) return null;

    // ---------- Filtrar candidatos válidos por rango ----------
    const candidates = [];
    for (const atk of BOSS_ATTACKS) {
            if (!BOSS_IMPLEMENTED_ATTACK_IDS.includes(atk.id)) continue;
      if (dist < atk.minRange || dist > atk.maxRange) continue;
      candidates.push(atk);
    }
    if (candidates.length === 0) return null;

    // ---------- Puntuar cada candidato ----------
    let bestAtk   = candidates[0];
    let bestScore = -Infinity;

    for (const atk of candidates) {
      let s = atk.weight || 1;

      // Penalización fuerte por repetir el mismo ataque seguido
      if (atk.id === boss.lastAttackId) s *= 0.3;

      // Bonus por estar cerca del centro del rango útil del ataque
      const mid      = (atk.minRange + atk.maxRange) / 2;
      const halfSpan = Math.max(1, (atk.maxRange - atk.minRange) / 2);
      const distFactor = 1 - Math.min(1, Math.abs(dist - mid) / halfSpan) * 0.4;
      s *= distFactor;

      // Aleatoriedad (evita que siempre elija el mismo)
      s *= 0.7 + Math.random() * 0.6;

      if (s > bestScore) {
        bestScore = s;
        bestAtk   = atk;
      }
    }

    return bestAtk;
  }

  /* ============================================================
     JEFE — IA completa (idle + pursue + telegraph + attack + recovery)
     ============================================================ */
  function updateBossAI(dt, now) {
    if (boss.dead) return;
    if (bossEl.style.display === 'none') return;

    // ---------- STAGGER ----------
    if (boss.state === 'stagger') {
      boss.staggerTimer -= dt * 1000;
      if (boss.staggerTimer <= 0) {
        boss.state = 'idle';
        boss.staggerTimer = 0;
        bossEl.classList.remove('stagger', 'stunned');
      }
      stopBoss();
      return;
    }

    // ---------- TELEGRAPH ----------
    if (boss.state === 'telegraph') {
      stopBoss();
      boss.stateTime += dt * 1000;

           if (boss.stateTime >= boss.currentAttack.telegraph) {
        // Pasar a fase activa
        boss.state     = 'attack';
        boss.stateTime = 0;
        boss.attackHit = false;

                bossEl.classList.remove('telegraphing');
        bossEl.classList.add('attacking');

        // Añadir clases de movimiento si aplica
        if (boss.dashing) bossEl.classList.add('dashing');
        if (boss.jumping) bossEl.classList.add('jumping');

        if (boss.comboSteps && boss.comboSteps.length > 0) {
          // Para combos el --attack-ms se ajusta en cada sub-golpe.
          // Ponemos el primero por defecto por si acaso.
          const firstActive = boss.currentAttack.comboSteps[0].active;
          bossEl.style.setProperty('--attack-ms', firstActive + 'ms');
        } else {
          // Ataque único: una animación larga = active + recovery
          const animMs = boss.currentAttack.active + boss.currentAttack.recovery;
          bossEl.style.setProperty('--attack-ms', animMs + 'ms');
        }
      }
      return;
    }

    // ---------- ATTACK (fase activa) ----------
     // ---------- ATTACK (fase activa) ----------
    if (boss.state === 'attack') {
      stopBoss();
      boss.stateTime += dt * 1000;

      if (boss.comboSteps && boss.comboSteps.length > 0) {
        // ============ COMBO: varios sub-golpes ============
        for (const entry of boss.comboSteps) {
          // Arranque de la animación del sub-golpe
          if (!entry.started && boss.stateTime >= entry.startAt) {
            entry.started = true;
            const stepActive = boss.currentAttack.comboSteps[entry.stepIndex].active;
            bossEl.style.setProperty('--attack-ms', stepActive + 'ms');
            bossEl.classList.remove('attacking');
            void bossEl.offsetWidth;   // fuerza reflow para reiniciar la animación
            bossEl.classList.add('attacking');
          }
          // Aplicar el daño del sub-golpe
          if (!entry.hit && boss.stateTime >= entry.hitAt) {
            entry.hit = true;
            checkBossHitbox(boss.currentAttack, entry.damage);
          }
        }

        // Fin del combo
        if (boss.stateTime >= boss.comboTotalMs) {
          boss.state     = 'recovery';
          boss.stateTime = 0;
        }

            } else {
        // ============ ATAQUE ÚNICO ============

        // ----- Movimiento durante la fase activa -----
        if (boss.currentAttack.movement === 'forward') {
          // Embestida: avanzar recto a alta velocidad
          const speed = boss.attackMoveSpeed || 300;
          const dirX  = boss.dir === 1 ? 1 : -1;
          moveBossBy(dirX, 0, speed, dt);
          // (moveBossBy ya resuelve la colisión con muros)

        } else if (boss.currentAttack.movement === 'jump') {
          // Salto: interpolar posición entre origen y destino
          const dur = boss.currentAttack.active;
          boss.jumpProgress = Math.min(1, boss.stateTime / dur);

          const t = boss.jumpProgress;
          const cx = boss.jumpStartX + (boss.jumpTargetX - boss.jumpStartX) * t;
          const cy = boss.jumpStartY + (boss.jumpTargetY - boss.jumpStartY) * t;

          boss.x = clamp(cx - CH_W / 2, 0, WORLD_SIZE - CH_W);
          boss.y = clamp(cy - CH_H / 2, 0, WORLD_SIZE - CH_H);
          resolveEntityWallCollision(boss, CH_W, CH_H);
        }

        // ----- Comprobación de hitbox -----
        if (boss.currentAttack.movement === 'forward') {
          // Embestida: chequear cada frame hasta acertar (una sola vez)
          if (!boss.attackHit) {
            const didHit = checkBossHitbox(boss.currentAttack);
            if (didHit) boss.attackHit = true;
          }

        } else if (boss.currentAttack.movement === 'jump') {
          // Salto: el golpe aterriza al ~70% de la fase activa
          if (!boss.attackHit &&
              boss.stateTime >= boss.currentAttack.active * 0.7) {
            boss.attackHit = true;
            checkBossHitbox(boss.currentAttack);
          }

        } else {
          // Ataque quieto normal: golpe al 42% de la fase activa
          if (!boss.attackHit &&
              boss.stateTime >= boss.currentAttack.active * 0.42) {
            boss.attackHit = true;
            checkBossHitbox(boss.currentAttack);
          }
        }

        if (boss.stateTime >= boss.currentAttack.active) {
          boss.state     = 'recovery';
          boss.stateTime = 0;
        }
      }
      return;
    }

    // ---------- RECOVERY ----------
    if (boss.state === 'recovery') {
      stopBoss();
      boss.stateTime += dt * 1000;

      if (boss.stateTime >= boss.currentAttack.recovery) {
        endBossAttack();
      }
      return;
    }

    // ---------- IDLE / PURSUE ----------
    const dist = distanceBetween(p, boss);

    if (!boss.detected) {
      stopBoss();
      boss.state = 'idle';
      return;
    }

    // Intentar iniciar un ataque si el jugador está en rango
    const atk = pickBossAttack(dist);
    if (atk) {
      startBossAttack(atk);
      return;
    }

    // Si está muy cerca pero no puede atacar (cooldown), quieto mirando
    if (dist <= BOSS_ATTACK_RANGE) {
      stopBoss();
      faceBossToPlayer();
      boss.state = 'idle';
      return;
    }

    // Perseguir por todo el mapa
    boss.state = 'pursue';
    const target = centerOf(p);
    moveBossToTarget(target.x, target.y, BOSS_SPEED, dt);
  }

    boss.pathIndex = 0;
    boss.pathTimer = 0;

    boss.moving = false;
    boss.dashing = false;
    boss.jumping = false;

    bossEl.classList.remove(
      'dead', 'attacking', 'telegraphing',
      'dashing', 'jumping', 'stagger',
      'stunned', 'moving', 'hurt', 'burning'
    );

    bossEl.style.display = '';

    bossHpFill.style.width = '100%';
    bossHpBar.classList.remove('visible');

        bossTelegraph.classList.remove('active');
    bossTelegraph.className = 'boss-telegraph';

    bossFlip.style.transform = 'scaleX(-1)';

    // Soltar el lock-on si estaba sobre el jefe (por si era antes de
    // resetearlo, que ya no existe como objetivo válido)
    if (lockedTarget === 'boss') releaseLock();

    renderBoss();
  }

  function hideBoss() {
    bossEl.style.display = 'none';
    bossEl.classList.remove(
      'attacking', 'telegraphing', 'dashing',
      'jumping', 'stagger', 'stunned', 'moving'
    );
    boss.detected = false;
    bossHpBar.classList.remove('visible');
    bossTelegraph.classList.remove('active');
  }

  function updateCamera() {
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;

    let focusX, focusY;

          const lockTgt = getLockedTarget();
    if (lockTgt && !p.dead) {
      const cp = centerOf(p);
      const ct = centerOf(lockTgt);
      focusX = (cp.x + ct.x) / 2;
      focusY = (cp.y + ct.y) / 2;
    } else {
      const cp = centerOf(p);
      focusX = cp.x;
      focusY = cp.y;
    }

    let camX = focusX - vw / 2;
    let camY = focusY - vh / 2;

    camX = clamp(camX, 0, Math.max(0, WORLD_SIZE - vw));
    camY = clamp(camY, 0, Math.max(0, WORLD_SIZE - vh));

    camera.x = camX;
    camera.y = camY;

    world.style.transform = `translate3d(${-camera.x}px, ${-camera.y}px, 0)`;
  }

  /* ============================================================
     BUCLE PRINCIPAL
     ============================================================ */
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    if (p.dashCooldown > 0) p.dashCooldown = Math.max(0, p.dashCooldown - dt);
    if (p.parryCooldown > 0) p.parryCooldown = Math.max(0, p.parryCooldown - dt);
    if (p.staminaPause > 0) p.staminaPause = Math.max(0, p.staminaPause - dt);

        const inputLocked = inventoryOpen || itemPickerOpen || pickupWindowOpen || p.drinking;

    if (!p.dead && !inputLocked) {

      if (p.stunTimer > 0) {
        p.stunTimer -= dt;
        if (p.stunTimer <= 0) endPlayerStun();

        if (p.moving) { p.moving = false; player.classList.remove('moving'); }
        if (p.running) { p.running = false; player.classList.remove('running'); }
      }
      else if (p.parrying) {
        if (p.moving) {
          p.moving = false;
          player.classList.remove('moving');
        }
        if (p.running) {
          p.running = false;
          player.classList.remove('running');
        }
      }
      else if (p.dashing) {
        p.dashTimer -= dt;

        const totalDist = DASH_SPEED * dt;
        const steps = Math.max(1, Math.ceil(totalDist / 8));
        const sx = (p.dashDirX * totalDist) / steps;
        const sy = (p.dashDirY * totalDist) / steps;

        let blocked = false;
        for (let s = 0; s < steps; s++) {
          p.x += sx;
          p.y += sy;
          p.x = clamp(p.x, 0, WORLD_SIZE - CH_W);
          p.y = clamp(p.y, 0, WORLD_SIZE - CH_H);

          if (entityOverlapsAnyWall(p.x, p.y, CH_W, CH_H)) {
            p.x -= sx;
            p.y -= sy;
            blocked = true;
            break;
          }
        }

        if (!p.moving) {
          p.moving = true;
          player.classList.add('moving');
        }

        if (blocked || p.dashTimer <= 0) {
          p.dashing = false;
          player.classList.remove('dashing');
        }
      }
      else {
        let dx = 0, dy = 0;
        let useContinuousInput = false;

        if (moveVec.active && moveVec.magnitude > 0.12) {
          dx = moveVec.x;
          dy = moveVec.y;
          useContinuousInput = true;
        } else {
          if (keys.left)  dx -= 1;
          if (keys.right) dx += 1;
          if (keys.up)    dy -= 1;
          if (keys.down)  dy += 1;
        }

        const isMoving = dx !== 0 || dy !== 0;

        if (isMoving) {
          const len = Math.hypot(dx, dy) || 1;
          dx /= len;
          dy /= len;

          let speed = p.defending ? SPEED_DEFEND : SPEED;
          if (p.attacking) speed *= 0.55;

          // Auto-run en táctil: joystick empujado al máximo
          const wantRun = isTouchDevice
            ? (useContinuousInput && moveVec.magnitude > 0.85)
            : shiftHeld;

          const canRun = wantRun && !p.defending && !p.attacking && p.stamina > 0;
          if (canRun) speed *= RUN_MULTIPLIER;

          if (canRun !== p.running) {
            p.running = canRun;
            player.classList.toggle('running', p.running);
          }

          p.x += dx * speed * dt;
          p.y += dy * speed * dt;

          if (dx !== 0 && !lockedOn) {
            const newDir = dx > 0 ? 1 : -1;
            if (newDir !== p.dir) {
              p.dir = newDir;
              playerFlip.style.transform = p.dir === -1 ? 'scaleX(-1)' : 'scaleX(1)';
            }
          }
        } else {
          if (p.running) {
            p.running = false;
            player.classList.remove('running');
          }
        }

        p.x = clamp(p.x, 0, WORLD_SIZE - CH_W);
        p.y = clamp(p.y, 0, WORLD_SIZE - CH_H);

        resolveEntityWallCollision(p, CH_W, CH_H);

        if (isMoving !== p.moving) {
          p.moving = isMoving;
          player.classList.toggle('moving', p.moving);
        }
      }

      if (p.running) {
        p.stamina = Math.max(0, p.stamina - STAMINA_RUN_DRAIN * dt);
        p.staminaPause = STAMINA_HIT_PAUSE;
        if (p.stamina <= 0 && p.running) {
          p.running = false;
          player.classList.remove('running');
        }
      } else if (p.dashing) {
      } else if (p.staminaPause > 0) {
      } else {
        let regen = STAMINA_REGEN;
        if (p.defending) regen *= STAMINA_DEFEND_REGEN_MULT;
        p.stamina = Math.min(STAMINA_MAX, p.stamina + regen * dt);
      }
    }

        const lockTgt = getLockedTarget();
    if (lockTgt && !p.dead) {
      faceEntity(p, lockTgt, playerFlip);
    } else if (lockedOn) {
      // El objetivo se ha perdido (murió, salió de zona...)
      releaseLock();
    }

    if (!p.dead) {
      updateAimAngle();
    }
    renderAimArrow();


        updateBombs(dt);
    updateEnemyAI(dt, now);
    updateBossAI(dt, now);

    resolvePlayerEnemyCollision();
    resolvePlayerBossCollision();

    if (!p.dashing) resolveEntityWallCollision(p, CH_W, CH_H);
    resolveEntityWallCollision(e, CH_W, CH_H);

           updatePickupProximity();
    updateBossProximity();
    updateBonfireProximity();
    updateTouchInteractButton();
    updateGateProximity(dt);

        renderPlayer();
    renderEnemy();
    renderBoss();
    renderPickup();
    renderBonfire();
    updateCamera();
    updateHUD();

    requestAnimationFrame(tick);
  }

    /* ============================================================
     PORTALES — detección de entrada
     ============================================================ */
  function updateGateProximity(dt) {
    if (gateCooldown > 0) {
      gateCooldown -= dt;
      return;
    }
    if (p.dead) return;

    const gates = ZONE_GATES[currentZone] || [];
    for (const g of gates) {
      // AABB del jugador vs AABB del portal
      if (p.x < g.x + g.w &&
          p.x + CH_W > g.x &&
          p.y < g.y + g.h &&
          p.y + CH_H > g.y) {
        cambiarZona(g.target, g.spawnX, g.spawnY);
        return;
      }
    }
  }

  /* ============================================================
     TECLADO
     ============================================================ */
  const MOVE_KEYMAP = {
    KeyW: 'up',
    KeyS: 'down',
    KeyA: 'left',
    KeyD: 'right'
  };

  addEventListener('keydown', ev => {
        if (ev.code === 'KeyE') {
      ev.preventDefault();
      handleEInteraction();
      return;
    }

    if (ev.code === 'KeyT') {
      ev.preventDefault();
      if (!pickupWindowOpen) toggleInventory();
      return;
    }
    
                if (ev.code === 'KeyR') {
      ev.preventDefault();
      if (!inventoryOpen && !itemPickerOpen && !pickupWindowOpen) {
        useEquippedBottle();
      }
      return;
    }


 


    if (ev.code === 'Escape') {
      if (pickupWindowOpen) {
        ev.preventDefault();
        closePickupWindow();
        return;
      }
      if (itemPickerOpen) {
        ev.preventDefault();
        closeItemPicker();
        return;
      }
      if (inventoryOpen) {
        ev.preventDefault();
        closeInventory();
        return;
      }
    }

    if (inventoryOpen || itemPickerOpen || pickupWindowOpen) return;

    if (ev.code === 'ArrowRight') {
      ev.preventDefault();
      cycleSlot('sword', +1);
      return;
    }
    if (ev.code === 'ArrowLeft') {
      ev.preventDefault();
      cycleSlot('shield', +1);
      return;
    }
    if (ev.code === 'ArrowDown') {
      ev.preventDefault();
      cycleSlot('bottle', +1);
      return;
    }
    if (ev.code === 'ArrowUp') {
      ev.preventDefault();
      return;
    }

    if (ev.code === 'Tab') {
      ev.preventDefault();
      triggerParry();
      return;
    }

    if (ev.code === 'ShiftLeft' || ev.code === 'ShiftRight') {
      shiftHeld = true;
      return;
    }

    if (ev.code === 'Space') {
      ev.preventDefault();
      triggerDash();
      return;
    }

    const k = MOVE_KEYMAP[ev.code];
    if (!k) return;
    ev.preventDefault();
    keys[k] = true;
  });

  addEventListener('keyup', ev => {
    if (ev.code === 'ShiftLeft' || ev.code === 'ShiftRight') {
      shiftHeld = false;
      return;
    }
    const k = MOVE_KEYMAP[ev.code];
    if (!k) return;
    ev.preventDefault();
    keys[k] = false;
  });

  /* ============================================================
     RATÓN
     ============================================================ */
 viewport.addEventListener('mousedown', ev => {
    if (isTouchDevice) return;   // ← añade esta línea
    if (inventoryOpen || itemPickerOpen || pickupWindowOpen) return;
    if (ev.button === 0) {
      ev.preventDefault();
      triggerPlayerAttack();
    } else if (ev.button === 1) {
      ev.preventDefault();
      toggleLock();
    } else if (ev.button === 2) {
      ev.preventDefault();
      setDefending(true);
    }
  });

  viewport.addEventListener('mouseup', ev => {
    if (inventoryOpen || itemPickerOpen || pickupWindowOpen) return;
    if (ev.button === 2) {
      ev.preventDefault();
      setDefending(false);
    }
  });

  viewport.addEventListener('auxclick', ev => {
    if (ev.button === 1) ev.preventDefault();
  });

  viewport.addEventListener('contextmenu', ev => ev.preventDefault());

  addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  shiftHeld = false;
  setDefending(false);
  // NUEVO: resetear joystick
  moveVec.x = 0; moveVec.y = 0; moveVec.active = false; moveVec.magnitude = 0;
  const jb = document.getElementById('joystickBase');
  const jk = document.getElementById('joystickKnob');
  if (jb) jb.classList.remove('active');
  if (jk) jk.classList.remove('active');
  if (p.running) {
    p.running = false;
    player.classList.remove('running');
  }
});

  addEventListener('resize', updateCamera);


  /* ============================================================
   CONTROLES TÁCTILES — inicialización
   ============================================================ */
function initTouchControls() {
  if (!isTouchDevice) return;

  const zone = document.getElementById('joystickZone');
  const base = document.getElementById('joystickBase');
  const knob = document.getElementById('joystickKnob');
  if (!zone || !base || !knob) return;

  let joyPointerId = null;
  let originX = 0, originY = 0;
  const MAX_RADIUS = 58;

  zone.addEventListener('pointerdown', ev => {
    if (joyPointerId !== null) return;
    if (inventoryOpen || itemPickerOpen || pickupWindowOpen) return;
    if (p.dead || p.stunTimer > 0) return;

    joyPointerId = ev.pointerId;
    try { zone.setPointerCapture(ev.pointerId); } catch (_) {}

    const rect = zone.getBoundingClientRect();
    originX = ev.clientX - rect.left;
    originY = ev.clientY - rect.top;

    base.style.left = originX + 'px';
    base.style.top  = originY + 'px';
    knob.style.left = originX + 'px';
    knob.style.top  = originY + 'px';
    base.classList.add('active');
    knob.classList.add('active');
    ev.preventDefault();
  }, { passive: false });

  zone.addEventListener('pointermove', ev => {
    if (ev.pointerId !== joyPointerId) return;

    const rect = zone.getBoundingClientRect();
    let dx = (ev.clientX - rect.left) - originX;
    let dy = (ev.clientY - rect.top)  - originY;

    const dist = Math.hypot(dx, dy);
    if (dist > MAX_RADIUS) {
      dx = (dx / dist) * MAX_RADIUS;
      dy = (dy / dist) * MAX_RADIUS;
    }

    knob.style.left = (originX + dx) + 'px';
    knob.style.top  = (originY + dy) + 'px';

    const mag = Math.min(1, dist / MAX_RADIUS);
    if (mag > 0.12) {
      const nrm = dist || 1;
      moveVec.x = dx / nrm;
      moveVec.y = dy / nrm;
      moveVec.magnitude = mag;
      moveVec.active = true;
    } else {
      moveVec.x = 0; moveVec.y = 0;
      moveVec.magnitude = 0;
      moveVec.active = false;
    }
    ev.preventDefault();
  }, { passive: false });

  const endJoy = ev => {
    if (ev.pointerId !== joyPointerId) return;
    joyPointerId = null;
    moveVec.x = 0; moveVec.y = 0;
    moveVec.active = false; moveVec.magnitude = 0;
    base.classList.remove('active');
    knob.classList.remove('active');
  };
  zone.addEventListener('pointerup', endJoy);
  zone.addEventListener('pointercancel', endJoy);

  // -------- Botones --------
 function bindTap(id, action, alwaysEnabled = false) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    if (!alwaysEnabled && (inventoryOpen || itemPickerOpen || pickupWindowOpen)) return;
    el.classList.add('pressed');
    try { el.setPointerCapture(ev.pointerId); } catch (_) {}
  }, { passive: false });
  el.addEventListener('pointerup', ev => {
    ev.preventDefault();
    el.classList.remove('pressed');
    if (!alwaysEnabled && (inventoryOpen || itemPickerOpen || pickupWindowOpen)) return;
    action();
  }, { passive: false });
  el.addEventListener('pointercancel', () => el.classList.remove('pressed'));
  el.addEventListener('pointerleave', () => el.classList.remove('pressed'));
}

  function bindHold(id, onDown, onUp) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      if (inventoryOpen || itemPickerOpen || pickupWindowOpen) return;
      el.classList.add('pressed');
      try { el.setPointerCapture(ev.pointerId); } catch (_) {}
      onDown();
    }, { passive: false });
    const up = () => {
      el.classList.remove('pressed');
      if (onUp) onUp();
    };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
  }

  bindTap('btnAttack', () => triggerPlayerAttack());
  bindHold('btnDefend', () => setDefending(true), () => setDefending(false));
  bindTap('btnDash',  () => triggerDash());
  bindTap('btnParry', () => triggerParry());
  bindTap('btnLock',  () => toggleLock());
  bindTap('btnBag',   () => toggleInventory(),  true);
  bindTap('btnItem',  () => useEquippedBottle());
bindTap('btnInteract', () => handleEInteraction(),  true);
}

/* Muestra el botón E solo cuando hay algo interactuable cerca */
function updateTouchInteractButton() {
  if (!isTouchDevice) return;
  const el = document.getElementById('btnInteract');
  if (!el) return;

  const canBonfire = bonfire.near;
  const canPickup  = !pickup.taken && pickup.near && currentZone === PICKUP_ZONE;
  el.classList.toggle('show', canBonfire || canPickup);
}

     INICIO
     ============================================================ */
   function init() {
    // Jugador: buscar hueco libre cerca del centro
    const pSpawn = findFreeSpawn(
      WORLD_SIZE / 2 - CH_W / 2,
      WORLD_SIZE / 2 - CH_H / 2,
      CH_W, CH_H
    );
    p.x = pSpawn.x;
    p.y = pSpawn.y;
    p.aimAngle = 0;

    // Enemigo: buscar hueco cerca de donde estaría normalmente
    const eSpawn = findFreeSpawn(p.x + 260, p.y - 80, CH_W, CH_H);
    e.x = eSpawn.x;
    e.y = eSpawn.y;
    e.dir = -1;
    e.stability = ENEMY_STABILITY_MAX;
    e.stabilityMax = ENEMY_STABILITY_MAX;
    enemyFlip.style.transform = 'scaleX(-1)';

    // Pickup: buscar hueco cerca del jugador
    const pickupSpawn = findFreeSpawn(p.x + 130, p.y - 30, 40, 40);
    pickup.x = pickupSpawn.x;
    pickup.y = pickupSpawn.y;

                // Hoguera: usar el spawn de la zona inicial
    const bSpawn = ZONE_BONFIRE_SPAWN[currentZone];
    if (bSpawn) {
      const bonfireSpawn = findFreeSpawn(bSpawn.x, bSpawn.y, 70, 70);
      bonfire.x = bonfireSpawn.x;
      bonfire.y = bonfireSpawn.y;
      bonfireEl.style.display = '';
    } else {
      bonfireEl.style.display = 'none';
    }
        renderZone();
    buildNavGrid();

        // Colocar al jefe en su spawn de la Zona 2 (aunque esté oculto)
    resetBoss(ZONE_BOSS_SPAWN[2].x, ZONE_BOSS_SPAWN[2].y);
    hideBoss();

    renderPlayer();
    renderEnemy();
    renderBoss();
    renderPickup();
    renderBonfire();
    renderAimArrow();
    updateCamera();
    viewport.style.cursor = 'crosshair';

        refreshAll();
    updateHUD();

    last = performance.now();
    requestAnimationFrame(tick);

    // Cartel de bienvenida a la zona inicial (con un pequeño retardo)
    setTimeout(() => mostrarTituloZona(currentZone), 350);

    initTouchControls();


  }
  

  requestAnimationFrame(init);
</script>
